<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="${league.name}">League</title></head>
<body>
<th:block layout:fragment="content">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/leagues}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div>
        <h1 class="h3 fw-bold mb-1" th:text="${league.name}">League</h1>
        <div class="d-flex gap-2 align-items-center">
          <span class="badge text-bg-secondary text-uppercase small" th:text="#{'sport.' + ${league.sportType}}">Sport</span>
          <span class="text-secondary small" th:text="${league.country}">Country</span>
        </div>
      </div>
    </div>
    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
      <a th:href="@{/leagues/{id}/edit(id=${league.id})}"
         class="btn btn-outline-primary btn-sm">
        <i class="bi bi-pencil me-1"></i><span th:text="#{leagues.action.edit}">Edit</span>
      </a>
      <a th:href="@{/leagues/{leagueId}/seasons/new(leagueId=${league.id})}"
         class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i><span th:text="#{leagues.detail.newSeason}">New Season</span>
      </a>
      <form th:action="@{/leagues/{id}/delete(id=${league.id})}" method="post" class="d-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-sm btn-outline-danger"
                th:attr="data-confirm=#{leagues.confirm.delete}" data-confirm="Delete this league and all its data?">
          <i class="bi bi-trash me-1"></i><span th:text="#{leagues.action.delete}">Delete</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Seasons -->
  <div class="sport-card">
    <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-secondary-subtle">
      <h5 class="mb-0 fw-semibold">
        <i class="bi bi-calendar3 me-2" style="color:#f97316"></i><span th:text="#{leagues.detail.seasons}">Seasons</span>
      </h5>
      <span class="badge rounded-pill text-bg-primary" th:text="${#lists.size(seasons)}">0</span>
    </div>

    <div th:if="${#lists.isEmpty(seasons)}" class="text-center py-5">
      <i class="bi bi-calendar-x display-5 text-secondary mb-3 d-block"></i>
      <p class="text-secondary mb-2" th:text="#{leagues.detail.noSeasons}">No seasons yet.</p>
      <a sec:authorize="hasRole('ADMIN')"
         th:href="@{/leagues/{leagueId}/seasons/new(leagueId=${league.id})}"
         class="btn btn-primary btn-sm" th:text="#{leagues.detail.createFirstSeason}">Create first season</a>
    </div>

    <div th:if="${not #lists.isEmpty(seasons)}" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th th:text="#{leagues.detail.col.season}">Season</th>
            <th th:text="#{leagues.detail.col.years}">Years</th>
            <th th:text="#{leagues.detail.col.status}">Status</th>
            <th th:text="#{leagues.detail.col.rounds}">Rounds</th>
            <th class="text-end" th:text="#{leagues.detail.col.actions}">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${seasons}">
            <td>
              <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${s.id})}"
                 class="fw-semibold text-decoration-none" th:text="${s.name}">Season</a>
            </td>
            <td class="font-monospace text-secondary small">
              <span th:text="${s.yearStart}">2026</span> / <span th:text="${s.yearEnd}">2027</span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="'badge-' + ${s.status}"
                    th:text="#{'status.' + ${s.status}}">UPCOMING</span>
            </td>
            <td class="font-monospace text-secondary" th:text="${s.roundCount}">0</td>
            <td class="text-end">
              <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${s.id})}"
                 class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-eye"></i>
              </a>
              <form sec:authorize="hasRole('ADMIN')"
                    th:action="@{/leagues/{lid}/seasons/{sid}/delete(lid=${league.id},sid=${s.id})}"
                    method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                        th:attr="data-confirm=#{leagues.confirm.deleteSeason}" data-confirm="Delete this season? All fixtures and rounds will be removed.">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</th:block>
</body>
</html>
