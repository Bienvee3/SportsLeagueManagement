<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="${league.name}">League</title></head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item"><a th:href="@{/leagues}">Leagues</a></li>
  <li class="breadcrumb-item active" th:text="${league.name}">League</li>
</th:block>
<th:block layout:fragment="content">

  <!-- Header -->
  <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-4">
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/leagues}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div>
        <h1 class="h3 fw-bold mb-1" th:text="${league.name}">League</h1>
        <div class="d-flex gap-2 align-items-center">
          <span class="badge bg-secondary text-uppercase small" th:text="${league.sportType}">Sport</span>
          <span class="text-muted small" th:text="${league.country}">Country</span>
        </div>
      </div>
    </div>
    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
      <a th:href="@{/leagues/{id}/edit(id=${league.id})}"
         class="btn btn-outline-primary btn-sm">
        <i class="bi bi-pencil me-1"></i>Edit
      </a>
      <a th:href="@{/leagues/{leagueId}/seasons/new(leagueId=${league.id})}"
         class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>New Season
      </a>
    </div>
  </div>

  <!-- Seasons -->
  <div class="card shadow-sm">
    <div class="card-header d-flex align-items-center justify-content-between">
      <h5 class="mb-0 fw-semibold">
        <i class="bi bi-calendar3 me-2"></i>Seasons
      </h5>
      <span class="badge bg-primary rounded-pill" th:text="${#lists.size(seasons)}">0</span>
    </div>

    <div th:if="${#lists.isEmpty(seasons)}" class="card-body text-center py-5">
      <i class="bi bi-calendar-x display-5 text-muted mb-3 d-block"></i>
      <p class="text-muted mb-2">No seasons yet.</p>
      <a sec:authorize="hasRole('ADMIN')"
         th:href="@{/leagues/{leagueId}/seasons/new(leagueId=${league.id})}"
         class="btn btn-primary btn-sm">Create first season</a>
    </div>

    <div th:if="${not #lists.isEmpty(seasons)}" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Season</th>
            <th>Years</th>
            <th>Status</th>
            <th class="table-actions"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${seasons}">
            <td>
              <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${s.id})}"
                 class="fw-semibold text-decoration-none" th:text="${s.name}">Season</a>
            </td>
            <td class="font-mono text-muted small">
              <span th:text="${s.yearStart}">2026</span> / <span th:text="${s.yearEnd}">2027</span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="'badge-' + ${s.status}"
                    th:text="${s.status}">UPCOMING</span>
            </td>
            <td>
              <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${s.id})}"
                 class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-eye"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</th:block>
</body>
</html>
