<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title th:text="${editMode} ? #{leagues.form.editTitle} : #{leagues.form.newTitle}">League Form</title>
</head>
<body>
<th:block layout:fragment="content">

  <div class="mx-auto" style="max-width:600px">

    <div class="page-header">
      <div class="d-flex align-items-center gap-3">
        <a th:href="${editMode} ? @{/leagues/{id}(id=${league?.id})} : @{/leagues}"
           class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="h3 fw-bold mb-0"
            th:text="${editMode} ? #{leagues.form.editTitle} : #{leagues.form.newTitle}">League</h1>
      </div>
    </div>

    <div class="sport-card p-4">
      <form th:action="${editMode} ? @{/leagues/{id}(id=${league.id})} : @{/leagues}"
            th:object="${form}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label fw-medium"><span th:text="#{leagues.form.name}">League name</span> <span class="text-danger">*</span></label>
          <input type="text" id="name"
                 class="form-control" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                 th:field="*{name}" required maxlength="100" th:placeholder="#{leagues.form.name.placeholder}" placeholder="e.g. Premier League">
          <div class="invalid-feedback" th:errors="*{name}">Required</div>
        </div>

        <!-- Slug (create only) -->
        <div class="mb-3" th:if="${not editMode}">
          <label for="slug" class="form-label fw-medium"><span th:text="#{leagues.form.slug}">URL slug</span> <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text text-secondary">/leagues/</span>
            <input type="text" id="slug"
                   class="form-control" th:classappend="${#fields.hasErrors('slug')} ? ' is-invalid'"
                   th:field="*{slug}" required maxlength="100"
                   placeholder="premier-league" pattern="[a-z0-9\-]+">
            <div class="invalid-feedback" th:errors="*{slug}">Required</div>
          </div>
          <div class="form-text" th:text="#{leagues.form.slug.help}">Lowercase letters, numbers and hyphens only.</div>
        </div>

        <!-- Sport Type -->
        <div class="mb-3">
          <label for="sportType" class="form-label fw-medium"><span th:text="#{leagues.form.sport}">Sport</span> <span class="text-danger">*</span></label>
          <select id="sportType" class="form-select"
                  th:field="*{sportType}"
                  th:classappend="${#fields.hasErrors('sportType')} ? ' is-invalid'">
            <option value="" th:text="#{leagues.form.sport.select}">Select sport…</option>
            <option value="FOOTBALL" th:text="#{sport.FOOTBALL}">Football</option>
            <option value="BASKETBALL" th:text="#{sport.BASKETBALL}">Basketball</option>
            <option value="VOLLEYBALL" th:text="#{sport.VOLLEYBALL}">Volleyball</option>
            <option value="HANDBALL" th:text="#{sport.HANDBALL}">Handball</option>
          </select>
          <div class="invalid-feedback" th:errors="*{sportType}">Required</div>
        </div>

        <!-- Country -->
        <div class="mb-4">
          <label for="country" class="form-label fw-medium"><span th:text="#{leagues.form.country}">Country</span> <span class="text-danger">*</span></label>
          <input type="text" id="country"
                 class="form-control" th:classappend="${#fields.hasErrors('country')} ? ' is-invalid'"
                 th:field="*{country}" required maxlength="100" th:placeholder="#{leagues.form.country.placeholder}" placeholder="e.g. England">
          <div class="invalid-feedback" th:errors="*{country}">Required</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>
            <span th:text="${editMode} ? #{leagues.form.save} : #{leagues.form.create}">Save</span>
          </button>
          <a th:href="${editMode} ? @{/leagues/{id}(id=${league.id})} : @{/leagues}"
             class="btn btn-outline-secondary" th:text="#{leagues.form.cancel}">Cancel</a>
        </div>
      </form>
    </div>

  </div>

</th:block>
</body>
</html>
