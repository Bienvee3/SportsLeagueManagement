<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title th:text="${editMode} ? 'Edit League' : 'New League'">League Form</title>
</head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item"><a th:href="@{/leagues}">Leagues</a></li>
  <li class="breadcrumb-item active"
      th:text="${editMode} ? 'Edit' : 'New League'">New</li>
</th:block>
<th:block layout:fragment="content">

  <div class="row justify-content-center">
    <div class="col-12 col-lg-7">

      <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="${editMode} ? @{/leagues/{id}(id=${league?.id})} : @{/leagues}"
           class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="h3 fw-bold mb-0"
            th:text="${editMode} ? 'Edit League' : 'New League'">League</h1>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form th:action="${editMode} ? @{/leagues/{id}(id=${league.id})} : @{/leagues}"
                th:object="${form}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label fw-medium">League name <span class="text-danger">*</span></label>
              <input type="text" id="name"
                     class="form-control" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                     th:field="*{name}" required maxlength="100" placeholder="e.g. Premier League">
              <div class="invalid-feedback" th:errors="*{name}">Required</div>
            </div>

            <!-- Slug (create only) -->
            <div class="mb-3" th:if="${not editMode}">
              <label for="slug" class="form-label fw-medium">URL slug <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text text-muted">/leagues/</span>
                <input type="text" id="slug"
                       class="form-control" th:classappend="${#fields.hasErrors('slug')} ? ' is-invalid'"
                       th:field="*{slug}" required maxlength="100"
                       placeholder="premier-league" pattern="[a-z0-9\-]+">
                <div class="invalid-feedback" th:errors="*{slug}">Required</div>
              </div>
              <div class="form-text">Lowercase letters, numbers and hyphens only.</div>
            </div>

            <!-- Sport Type -->
            <div class="mb-3">
              <label for="sportType" class="form-label fw-medium">Sport <span class="text-danger">*</span></label>
              <select id="sportType" class="form-select"
                      th:field="*{sportType}"
                      th:classappend="${#fields.hasErrors('sportType')} ? ' is-invalid'">
                <option value="">Select sport…</option>
                <option value="FOOTBALL">Football</option>
                <option value="BASKETBALL">Basketball</option>
                <option value="VOLLEYBALL">Volleyball</option>
                <option value="HANDBALL">Handball</option>
              </select>
              <div class="invalid-feedback" th:errors="*{sportType}">Required</div>
            </div>

            <!-- Country -->
            <div class="mb-4">
              <label for="country" class="form-label fw-medium">Country <span class="text-danger">*</span></label>
              <input type="text" id="country"
                     class="form-control" th:classappend="${#fields.hasErrors('country')} ? ' is-invalid'"
                     th:field="*{country}" required maxlength="100" placeholder="e.g. England">
              <div class="invalid-feedback" th:errors="*{country}">Required</div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>
                <span th:text="${editMode} ? 'Save changes' : 'Create League'">Save</span>
              </button>
              <a th:href="${editMode} ? @{/leagues/{id}(id=${league.id})} : @{/leagues}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

</th:block>
</body>
</html>
