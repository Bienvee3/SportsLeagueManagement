<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title>Leagues</title></head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item active">Leagues</li>
</th:block>
<th:block layout:fragment="content">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 fw-bold mb-1">Leagues</h1>
      <p class="text-muted mb-0 small">Manage all competitions</p>
    </div>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/leagues/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>New League
    </a>
  </div>

  <div class="card shadow-sm">
    <div th:if="${#lists.isEmpty(leagues)}" class="card-body text-center py-5">
      <i class="bi bi-trophy display-5 text-muted mb-3 d-block"></i>
      <p class="text-muted mb-0">No leagues found.</p>
    </div>

    <div th:if="${not #lists.isEmpty(leagues)}" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Sport</th>
            <th>Country</th>
            <th class="table-actions"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="l : ${leagues}">
            <td>
              <a th:href="@{/leagues/{id}(id=${l.id})}"
                 class="fw-semibold text-decoration-none"
                 th:text="${l.name}">Name</a>
            </td>
            <td><span class="badge bg-secondary text-uppercase small" th:text="${l.sportType}">Sport</span></td>
            <td class="text-muted" th:text="${l.country}">Country</td>
            <td>
              <div class="d-flex gap-1 justify-content-end">
                <a th:href="@{/leagues/{id}(id=${l.id})}"
                   class="btn btn-sm btn-outline-secondary" title="View">
                  <i class="bi bi-eye"></i>
                </a>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{/leagues/{id}/edit(id=${l.id})}"
                   class="btn btn-sm btn-outline-primary" title="Edit">
                  <i class="bi bi-pencil"></i>
                </a>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{/leagues/{id}/delete(id=${l.id})}"
                      method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"
                          data-confirm="Delete this league and all its data?">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</th:block>
</body>
</html>
