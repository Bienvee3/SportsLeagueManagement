<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title>Leagues</title></head>
<body>
<th:block layout:fragment="content">

  <div class="page-header">
    <div>
      <h1 class="h3 fw-bold mb-1">Leagues</h1>
      <p class="text-secondary mb-0 small">Manage all competitions</p>
    </div>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/leagues/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>New League
    </a>
  </div>

  <div th:if="${#lists.isEmpty(leagues)}" class="sport-card p-5 text-center">
    <i class="bi bi-trophy display-4 text-secondary mb-3 d-block"></i>
    <p class="text-secondary mb-0">No leagues found.</p>
  </div>

  <div th:if="${not #lists.isEmpty(leagues)}" class="row g-3">
    <div class="col-12 col-md-6 col-xl-4" th:each="l : ${leagues}">
      <div class="sport-card p-4 h-100 position-relative">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <i class="bi bi-trophy-fill fs-3" style="color:#f97316"></i>
          <span class="badge text-bg-secondary text-uppercase small" th:text="${l.sportType}">Sport</span>
        </div>
        <h3 class="h4 fw-bold mb-1">
          <a th:href="@{/leagues/{id}(id=${l.id})}"
             class="text-decoration-none text-reset stretched-link" th:text="${l.name}">Name</a>
        </h3>
        <p class="text-secondary mb-0">
          <i class="bi bi-geo-alt me-1"></i><span th:text="${l.country}">Country</span>
        </p>
        <div class="d-flex gap-2 justify-content-end mt-3 position-relative" style="z-index:2">
          <a sec:authorize="hasRole('ADMIN')"
             th:href="@{/leagues/{id}/edit(id=${l.id})}"
             class="btn btn-sm btn-outline-primary" title="Edit">
            <i class="bi bi-pencil"></i>
          </a>
          <form sec:authorize="hasRole('ADMIN')"
                th:action="@{/leagues/{id}/delete(id=${l.id})}"
                method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete"
                    data-confirm="Delete this league and all its data?">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

</th:block>
</body>
</html>
