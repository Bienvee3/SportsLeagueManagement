<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head>
  <title th:text="${fixture.homeTeamName} + ' vs ' + ${fixture.awayTeamName}">Fixture</title>
</head>
<body>
<th:block layout:fragment="content">

  <!-- Back link -->
  <a href="javascript:history.back()" class="text-decoration-none small text-secondary d-inline-flex align-items-center gap-1 mb-3">
    <i class="bi bi-arrow-left"></i>Back to calendar
  </a>

  <!-- ===== MATCH SCOREBOARD ===== -->
  <div class="match-scoreboard card mb-4">
    <div class="card-body py-4 px-3 px-md-5">
      <div class="text-center mb-3 d-flex justify-content-center gap-2 flex-wrap">
        <span class="badge bg-dark border">
          <i class="bi bi-flag me-1"></i>Round <span th:text="${fixture.roundNumber}">1</span>
        </span>
        <span class="text-secondary small align-self-center" th:text="${fixture.roundName}">Round name</span>
      </div>

      <div class="row align-items-center text-center g-3">
        <!-- Home -->
        <div class="col-12 col-md">
          <div class="match-team" th:text="${fixture.homeTeamName}">Home</div>
          <span class="badge bg-secondary font-monospace mt-1" th:text="${fixture.homeTeamCode}">HOM</span>
        </div>

        <!-- Score -->
        <div class="col-12 col-md-auto px-md-4">
          <div th:if="${fixture.homeScore != null}" class="match-score font-monospace">
            <span th:text="${fixture.homeScore}">0</span>
            <span class="text-secondary mx-1">-</span>
            <span th:text="${fixture.awayScore}">0</span>
          </div>
          <div th:if="${fixture.homeScore == null}" class="match-score font-monospace text-secondary">- vs -</div>
          <div class="mt-2 d-flex justify-content-center align-items-center gap-2 flex-wrap">
            <span class="badge" th:classappend="'badge-' + ${fixture.status}"
                  th:text="${fixture.status}">SCHEDULED</span>
            <span class="text-secondary small">
              <i class="bi bi-clock me-1"></i><span th:text="${fixture.scheduledTime.toString().substring(0,16).replace('T',' ')}">Date</span>
            </span>
          </div>
        </div>

        <!-- Away -->
        <div class="col-12 col-md">
          <div class="match-team" th:text="${fixture.awayTeamName}">Away</div>
          <span class="badge bg-secondary font-monospace mt-1" th:text="${fixture.awayTeamCode}">AWY</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="overview-tab"
              data-bs-toggle="tab" data-bs-target="#overview-pane"
              type="button" role="tab">
        <i class="bi bi-info-circle me-1"></i>Overview
      </button>
    </li>
    <li class="nav-item" role="presentation" sec:authorize="hasAnyRole('ADMIN','OFFICIAL')">
      <button class="nav-link" id="actions-tab"
              data-bs-toggle="tab" data-bs-target="#actions-pane"
              type="button" role="tab">
        <i class="bi bi-pencil-square me-1"></i>Actions
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ===== OVERVIEW TAB ===== -->
    <div class="tab-pane fade show active" id="overview-pane" role="tabpanel">

      <div class="sport-card mb-4">
        <div class="d-flex align-items-center justify-content-between px-3 py-3 border-bottom border-secondary-subtle">
          <span class="fw-semibold"><i class="bi bi-lightning-charge me-2 text-warning"></i>Match Events</span>
          <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(fixture.events)}">0</span>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(fixture.events)}" class="text-center py-5">
          <i class="bi bi-stopwatch display-6 text-secondary d-block mb-2"></i>
          <p class="text-secondary small mb-0">No events recorded yet.</p>
        </div>

        <div th:if="${not #lists.isEmpty(fixture.events)}" class="p-3">
          <div class="event-timeline">
            <div th:each="ev : ${fixture.events}"
                 class="event-item d-flex align-items-center gap-3"
                 th:classappend="'event-' + ${ev.eventType}">
              <span class="badge bg-dark border font-monospace flex-shrink-0"
                    style="min-width:44px; text-align:center"
                    th:text="|${ev.minute}'|">45'</span>
              <span class="flex-shrink-0 fs-5">
                <th:block th:switch="${ev.eventType}">
                  <i th:case="'GOAL'"         class="bi bi-dribbble text-success"></i>
                  <i th:case="'OWN_GOAL'"     class="bi bi-dribbble text-danger"></i>
                  <i th:case="'YELLOW_CARD'"  class="bi bi-square-fill text-warning"></i>
                  <i th:case="'RED_CARD'"     class="bi bi-square-fill text-danger"></i>
                  <i th:case="'SUBSTITUTION'" class="bi bi-arrow-down-up text-primary"></i>
                  <i th:case="'PENALTY'"      class="bi bi-bullseye text-info"></i>
                  <i th:case="*"              class="bi bi-dot"></i>
                </th:block>
              </span>
              <div class="flex-grow-1">
                <span class="fw-medium" th:text="${ev.playerName}">Player</span>
                <span th:if="${ev.assistingPlayer != null and not #strings.isEmpty(ev.assistingPlayer)}"
                      class="text-secondary small"
                      th:text="' (assist: ' + ${ev.assistingPlayer} + ')'"></span>
              </div>
              <span class="badge bg-secondary font-monospace flex-shrink-0"
                    th:text="${ev.teamCode}">TM</span>
            </div>
          </div>
        </div>
      </div>

      <!-- AI Chronicle -->
      <div class="sport-card" th:if="${fixture.status == 'FINISHED'}" id="chronicle-card"
           th:attr="data-url=@{/api/fixtures/{id}/chronicle(id=${fixture.id})}">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-3 py-3 border-bottom border-secondary-subtle">
          <span class="fw-semibold"><i class="bi bi-stars me-2 text-warning"></i>AI Match Chronicle</span>
          <button type="button" class="btn btn-sm btn-outline-light"
                  th:attr="data-chronicle-lang=${#locale.language == 'hr'} ? 'CROATIAN' : 'ENGLISH'">
            <i class="bi bi-stars me-1"></i>
            <span th:text="${#locale.language == 'hr'} ? 'Generate (Hrvatski)' : 'Generate (English)'">Generate</span>
          </button>
        </div>
        <div class="p-3">
          <p id="chronicle-text" class="chronicle-text mb-0 text-secondary small">
            <i class="bi bi-info-circle me-1"></i>Generated on demand by AI in the app language (switch it in the top bar).
          </p>
        </div>
      </div>

    </div><!-- /#overview-pane -->


    <!-- ===== ACTIONS TAB ===== -->
    <div class="tab-pane fade" id="actions-pane" role="tabpanel"
         sec:authorize="hasAnyRole('ADMIN','OFFICIAL')">

      <div class="row g-3 mb-4">

        <!-- Record / correct result -->
        <div class="col-12 col-lg-6"
             th:if="${fixture.status == 'SCHEDULED' or fixture.status == 'IN_PROGRESS' or fixture.status == 'FINISHED'}">
          <div class="sport-card h-100">
            <div class="px-3 py-3 border-bottom border-secondary-subtle fw-semibold">
              <i class="bi bi-pencil-square me-2 text-warning"></i>
              <span th:text="${fixture.status == 'FINISHED'} ? 'Correct Result' : 'Record Result'">Record</span>
            </div>
            <div class="p-3">
              <form th:action="${fixture.status == 'FINISHED'} ? @{/fixtures/{id}/correct-result(id=${fixture.id})} : @{/fixtures/{id}/result(id=${fixture.id})}"
                    method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="d-flex align-items-end gap-2">
                  <div class="text-center flex-grow-1">
                    <label class="form-label small fw-medium" th:text="${fixture.homeTeamCode}">HOM</label>
                    <input type="number"
                           th:name="${fixture.status == 'FINISHED'} ? 'newHomeScore' : 'homeScore'"
                           class="form-control font-monospace text-center"
                           th:value="${fixture.homeScore}" min="0" max="99" required>
                  </div>
                  <div class="pb-2 fw-bold text-secondary">-</div>
                  <div class="text-center flex-grow-1">
                    <label class="form-label small fw-medium" th:text="${fixture.awayTeamCode}">AWY</label>
                    <input type="number"
                           th:name="${fixture.status == 'FINISHED'} ? 'newAwayScore' : 'awayScore'"
                           class="form-control font-monospace text-center"
                           th:value="${fixture.awayScore}" min="0" max="99" required>
                  </div>
                </div>
                <div th:if="${fixture.status == 'FINISHED'}" class="mt-3">
                  <label class="form-label small fw-medium">Reason</label>
                  <input type="text" name="reason" class="form-control"
                         placeholder="Reason for correction" required maxlength="255">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">
                  <i class="bi bi-check-lg me-1"></i>
                  <span th:text="${fixture.status == 'FINISHED'} ? 'Correct' : 'Save result'">Save</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Postpone / Cancel -->
        <div class="col-12 col-lg-6"
             th:if="${fixture.status == 'SCHEDULED' or fixture.status == 'IN_PROGRESS'}">
          <div class="sport-card h-100">
            <div class="px-3 py-3 border-bottom border-secondary-subtle fw-semibold">
              <i class="bi bi-calendar-x me-2 text-warning"></i>Manage
            </div>
            <div class="p-3 d-flex flex-column gap-3">
              <form th:action="@{/fixtures/{id}/postpone(id=${fixture.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="form-label small fw-medium">Postpone</label>
                <div class="input-group">
                  <input type="text" name="reason" class="form-control"
                         placeholder="Reason for postponement" required maxlength="255">
                  <button type="submit" class="btn btn-warning">
                    <i class="bi bi-pause-circle me-1"></i>Postpone
                  </button>
                </div>
              </form>
              <form th:action="@{/fixtures/{id}/cancel(id=${fixture.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger w-100"
                        data-confirm="Cancel this fixture? This cannot be undone.">
                  <i class="bi bi-x-circle me-1"></i>Cancel fixture
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Record match event -->
        <div class="col-12"
             th:if="${fixture.status == 'IN_PROGRESS' or fixture.status == 'FINISHED'}">
          <div class="sport-card">
            <div class="px-3 py-3 border-bottom border-secondary-subtle fw-semibold">
              <i class="bi bi-lightning-charge me-2 text-warning"></i>Record Match Event
            </div>
            <div class="p-3">
              <form th:action="@{/fixtures/{id}/events(id=${fixture.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3 align-items-end">
                  <div class="col-6 col-md-2">
                    <label class="form-label small fw-medium">Team</label>
                    <select name="teamId" class="form-select" required>
                      <option th:value="${fixture.homeTeamId}" th:text="${fixture.homeTeamName}">Home</option>
                      <option th:value="${fixture.awayTeamId}" th:text="${fixture.awayTeamName}">Away</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-2">
                    <label class="form-label small fw-medium">Minute</label>
                    <input type="number" name="matchMinute"
                           class="form-control font-monospace"
                           min="1" max="130" placeholder="45" required>
                  </div>
                  <div class="col-6 col-md-2">
                    <label class="form-label small fw-medium">Type</label>
                    <select name="eventType" class="form-select" required>
                      <option value="GOAL">Goal</option>
                      <option value="OWN_GOAL">Own goal</option>
                      <option value="YELLOW_CARD">Yellow card</option>
                      <option value="RED_CARD">Red card</option>
                      <option value="SUBSTITUTION">Substitution</option>
                      <option value="PENALTY">Penalty</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label small fw-medium">Player</label>
                    <input type="text" name="playerName" class="form-control"
                           placeholder="Player name" required maxlength="100">
                  </div>
                  <div class="col-12 col-md-3">
                    <label class="form-label small fw-medium">Assist (optional)</label>
                    <input type="text" name="assistingPlayer" class="form-control"
                           placeholder="Assisting player" maxlength="100">
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg me-1"></i>Add Event
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div><!-- /#actions-pane -->

  </div><!-- /.tab-content -->

</th:block>
</body>
</html>
