<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="${fixture.homeTeamName} + ' vs ' + ${fixture.awayTeamName}">Fixture</title></head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item active">Fixture</li>
</th:block>
<th:block layout:fragment="content">

  <!-- Match header card -->
  <div class="card shadow-sm mb-4">
    <div class="card-body py-4">
      <div class="text-center text-muted small mb-3">
        <span th:text="${fixture.roundName}">Round 1</span>
        &nbsp;·&nbsp;
        <span th:text="${#temporals.format(fixture.scheduledTime, 'EEE dd MMM yyyy HH:mm')}">Date</span>
        &nbsp;·&nbsp;
        <span class="badge" th:classappend="'badge-' + ${fixture.status}"
              th:text="${fixture.status}">SCHEDULED</span>
      </div>

      <div class="row align-items-center text-center">
        <!-- Home team -->
        <div class="col">
          <div class="fs-5 fw-bold" th:text="${fixture.homeTeamName}">Home</div>
          <div class="text-muted small font-mono" th:text="${fixture.homeTeamCode}">HOM</div>
        </div>
        <!-- Score -->
        <div class="col-auto px-4">
          <div th:if="${fixture.homeScore != null}"
               class="score-box display-5 fw-bold font-mono">
            <span th:text="${fixture.homeScore}">0</span>
            <span class="text-muted mx-1">–</span>
            <span th:text="${fixture.awayScore}">0</span>
          </div>
          <div th:if="${fixture.homeScore == null}"
               class="score-box display-5 fw-bold text-muted font-mono">
            vs
          </div>
        </div>
        <!-- Away team -->
        <div class="col">
          <div class="fs-5 fw-bold" th:text="${fixture.awayTeamName}">Away</div>
          <div class="text-muted small font-mono" th:text="${fixture.awayTeamCode}">AWY</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action cards (ADMIN / OFFICIAL only) -->
  <div sec:authorize="hasAnyRole('ADMIN','OFFICIAL')" class="row g-3 mb-4">

    <!-- Record / correct result -->
    <div class="col-12 col-md-6"
         th:if="${fixture.status == 'SCHEDULED' or fixture.status == 'IN_PROGRESS' or fixture.status == 'FINISHED'}">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold small">
          <i class="bi bi-pencil-square me-2"></i>
          <span th:text="${fixture.status == 'FINISHED'} ? 'Correct Result' : 'Record Result'">Record</span>
        </div>
        <div class="card-body">
          <form th:action="${fixture.status == 'FINISHED'} ? @{/fixtures/{id}/correct-result(id=${fixture.id})} : @{/fixtures/{id}/result(id=${fixture.id})}"
                method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="d-flex align-items-end gap-2">
              <div class="text-center flex-grow-1">
                <label class="form-label small fw-medium" th:text="${fixture.homeTeamCode}">HOM</label>
                <input type="number" name="homeScore"
                       class="form-control form-control-sm font-mono text-center"
                       th:value="${fixture.homeScore}" min="0" max="99" required>
              </div>
              <div class="pb-1 fw-bold text-muted">–</div>
              <div class="text-center flex-grow-1">
                <label class="form-label small fw-medium" th:text="${fixture.awayTeamCode}">AWY</label>
                <input type="number" name="awayScore"
                       class="form-control form-control-sm font-mono text-center"
                       th:value="${fixture.awayScore}" min="0" max="99" required>
              </div>
              <div th:if="${fixture.status == 'FINISHED'}" class="flex-grow-2">
                <label class="form-label small fw-medium">Reason</label>
                <input type="text" name="reason"
                       class="form-control form-control-sm"
                       placeholder="Reason for correction" required maxlength="255">
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100 mt-3">
              <i class="bi bi-check-lg me-1"></i>
              <span th:text="${fixture.status == 'FINISHED'} ? 'Correct' : 'Save result'">Save</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Postpone / Cancel -->
    <div class="col-12 col-md-6"
         th:if="${fixture.status == 'SCHEDULED' or fixture.status == 'IN_PROGRESS'}">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold small">
          <i class="bi bi-calendar-x me-2"></i>Manage
        </div>
        <div class="card-body d-flex flex-column gap-2">
          <!-- Postpone -->
          <form th:action="@{/fixtures/{id}/postpone(id=${fixture.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="input-group input-group-sm">
              <input type="text" name="reason" class="form-control"
                     placeholder="Reason for postponement" required maxlength="255">
              <button type="submit" class="btn btn-warning">
                <i class="bi bi-pause-circle me-1"></i>Postpone
              </button>
            </div>
          </form>
          <!-- Cancel -->
          <form th:action="@{/fixtures/{id}/cancel(id=${fixture.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                    data-confirm="Cancel this fixture? This cannot be undone.">
              <i class="bi bi-x-circle me-1"></i>Cancel fixture
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Record match event -->
    <div class="col-12"
         th:if="${fixture.status == 'IN_PROGRESS' or fixture.status == 'FINISHED'}">
      <div class="card shadow-sm">
        <div class="card-header fw-semibold small">
          <i class="bi bi-lightning me-2"></i>Record Match Event
        </div>
        <div class="card-body">
          <form th:action="@{/fixtures/{id}/events(id=${fixture.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-2 align-items-end">
              <div class="col-6 col-md-2">
                <label class="form-label form-label-sm fw-medium">Minute</label>
                <input type="number" name="matchMinute"
                       class="form-control form-control-sm font-mono"
                       min="1" max="130" placeholder="45" required>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label form-label-sm fw-medium">Type</label>
                <select name="eventType" class="form-select form-select-sm" required>
                  <option value="GOAL">Goal</option>
                  <option value="OWN_GOAL">Own goal</option>
                  <option value="YELLOW_CARD">Yellow card</option>
                  <option value="RED_CARD">Red card</option>
                  <option value="SUBSTITUTION">Substitution</option>
                  <option value="PENALTY">Penalty</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label form-label-sm fw-medium">Player</label>
                <input type="text" name="playerName"
                       class="form-control form-control-sm"
                       placeholder="Player name" required maxlength="100">
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label form-label-sm fw-medium">Assist (optional)</label>
                <input type="text" name="assistingPlayer"
                       class="form-control form-control-sm"
                       placeholder="Assisting player" maxlength="100">
              </div>
              <div class="col-12 col-md-2">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                  <i class="bi bi-plus-lg me-1"></i>Add
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>

  <!-- AI Chronicle section -->
  <div class="card shadow-sm" th:if="${fixture.status == 'FINISHED'}">
    <div class="card-header d-flex align-items-center justify-content-between">
      <span class="fw-semibold small">
        <i class="bi bi-stars me-2"></i>AI Match Chronicle
      </span>
      <div class="d-flex gap-2">
        <a th:href="@{/api/fixtures/{id}/chronicle(id=${fixture.id})}"
           class="btn btn-sm btn-outline-secondary" target="_blank">
          <i class="bi bi-translate me-1"></i>English
        </a>
        <a th:href="@{/api/fixtures/{id}/chronicle(id=${fixture.id},lang=CROATIAN)}"
           class="btn btn-sm btn-outline-secondary" target="_blank">
          <i class="bi bi-translate me-1"></i>Croatian
        </a>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-0">
        <i class="bi bi-info-circle me-1"></i>
        Chronicle is generated on demand via the REST API above. Opens in a new tab.
      </p>
    </div>
  </div>

</th:block>
</body>
</html>
