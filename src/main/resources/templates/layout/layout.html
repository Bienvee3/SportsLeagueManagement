<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE — League Ops">League Ops</title>
  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom overrides -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Flash data carrier (read by app.js) -->
<span id="flash-data"
      th:if="${flashMsg}"
      th:attr="data-msg=${flashMsg}"
      hidden></span>

<!-- Mobile sidebar backdrop -->
<div id="sidebar-backdrop"></div>

<!-- ===== SIDEBAR ===== -->
<nav id="sidebar" class="bg-dark" data-bs-theme="dark">

  <a th:href="@{/}" class="brand">
    <span class="brand-mark">LO</span>
    League Ops
  </a>

  <div class="px-2 py-2">

    <div class="nav-section">Main</div>
    <a th:href="@{/}" class="nav-link"
       th:classappend="${currentPage == 'dashboard'} ? ' active'">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <div class="nav-section mt-2">Competition</div>
    <a th:href="@{/leagues}" class="nav-link"
       th:classappend="${currentPage == 'leagues'} ? ' active'">
      <i class="bi bi-trophy"></i> Leagues
    </a>
    <a th:href="@{/teams}" class="nav-link"
       th:classappend="${currentPage == 'teams'} ? ' active'">
      <i class="bi bi-people"></i> Teams
    </a>

    <!-- ADMIN only section -->
    <div sec:authorize="hasRole('ADMIN')">
      <div class="nav-section mt-2">Admin</div>
      <a th:href="@{/leagues/new}" class="nav-link">
        <i class="bi bi-plus-circle"></i> New League
      </a>
      <a th:href="@{/teams/new}" class="nav-link">
        <i class="bi bi-person-plus"></i> New Team
      </a>
    </div>

  </div>

  <div class="sidebar-footer">
    <div class="d-flex align-items-center gap-2">
      <div style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex-shrink:0">
        <i class="bi bi-person-fill" style="font-size:.75rem;color:rgba(255,255,255,.7)"></i>
      </div>
      <div>
        <div style="font-size:.75rem;font-weight:600;color:rgba(255,255,255,.85)" sec:authentication="name">user</div>
        <div style="font-size:.65rem;color:rgba(255,255,255,.35)" sec:authentication="principal.authorities">roles</div>
      </div>
    </div>
    <form th:action="@{/logout}" method="post" class="mt-2">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit"
              class="btn btn-sm btn-outline-secondary w-100 text-start px-2 py-1">
        <i class="bi bi-box-arrow-left me-1"></i>Sign out
      </button>
    </form>
  </div>

</nav>
<!-- ===== END SIDEBAR ===== -->

<!-- ===== MAIN ===== -->
<div id="main-wrapper">

  <!-- Topbar -->
  <header id="topbar">
    <button id="menu-toggle-btn" aria-label="Toggle navigation">
      <i class="bi bi-list"></i>
    </button>

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="me-auto">
      <ol class="breadcrumb mb-0 small">
        <th:block layout:fragment="breadcrumb">
          <li class="breadcrumb-item active">Home</li>
        </th:block>
      </ol>
    </nav>

    <!-- User menu -->
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2"
              type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-md-inline" sec:authentication="name">user</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <span class="dropdown-item-text">
            <span class="fw-semibold d-block" sec:authentication="name">user</span>
            <span class="text-muted small" sec:authentication="principal.authorities">roles</span>
          </span>
        </li>
        <li><hr class="dropdown-divider"></li>

        <!-- Role switcher: visible only when user has ROLE_SWITCH_USER (admin) -->
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <span class="dropdown-item-text small text-muted text-uppercase fw-semibold"
                style="font-size:.65rem;letter-spacing:.06em">Switch Role (dev)</span>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="username" value="test-official">
            <button type="submit" class="dropdown-item rounded">
              <i class="bi bi-shield-half me-2 text-warning"></i>Preview as Official
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="username" value="test-viewer">
            <button type="submit" class="dropdown-item rounded">
              <i class="bi bi-eye me-2 text-info"></i>Preview as Viewer
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <hr class="dropdown-divider">
        </li>

        <!-- Exit impersonation: visible only when switched -->
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <span class="dropdown-item-text text-warning small">
            <i class="bi bi-exclamation-triangle me-1"></i>Role preview active
          </span>
        </li>
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch-exit}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item rounded text-warning">
              <i class="bi bi-arrow-return-left me-2"></i>Return to Admin
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <hr class="dropdown-divider">
        </li>

        <li>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item text-danger rounded">
              <i class="bi bi-box-arrow-left me-2"></i>Sign out
            </button>
          </form>
        </li>
      </ul>
    </div>
  </header>

  <!-- Page content -->
  <main class="page-content">
    <!-- Flash alert -->
    <div th:if="${flashMsg}"
         class="alert alert-success alert-dismissible auto-dismiss fade show mb-3"
         role="alert">
      <i class="bi bi-check-circle me-2"></i>
      <span th:text="${flashMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible auto-dismiss fade show mb-3"
         role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>
      <span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <th:block layout:fragment="content">
      <!-- page body inserted here -->
    </th:block>
  </main>

</div>
<!-- ===== END MAIN ===== -->

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmzV7Kb+5P4+CtCFjJUBzSrCbxo"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
