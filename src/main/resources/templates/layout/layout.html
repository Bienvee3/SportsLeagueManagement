<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <title layout:title-pattern="$CONTENT_TITLE — League Ops">League Ops</title>
  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom design system -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ===== TOPBAR ===== -->
<header class="app-nav">

  <!-- Brand -->
  <a th:href="@{/}" class="app-brand">
    <i class="bi bi-dribbble brand-icon"></i>LeagueOps
  </a>

  <!-- Primary navigation -->
  <nav class="app-nav-center" aria-label="Main navigation">
    <a th:href="@{/}" class="app-nav-link"
       th:classappend="${currentPage == 'dashboard'} ? ' active'">
      <i class="bi bi-speedometer2"></i><span class="label">Dashboard</span>
    </a>
    <a th:href="@{/leagues}" class="app-nav-link"
       th:classappend="${currentPage == 'leagues'} ? ' active'">
      <i class="bi bi-trophy"></i><span class="label">Leagues</span>
    </a>
    <a th:href="@{/teams}" class="app-nav-link"
       th:classappend="${currentPage == 'teams'} ? ' active'">
      <i class="bi bi-people"></i><span class="label">Teams</span>
    </a>
  </nav>

  <!-- Role switcher (dev preview) + user menu -->
  <div class="app-nav-right">
    <div class="lang-switch" title="App language (also sets the AI chronicle language)">
      <span th:class="${#locale.language != 'hr'} ? 'lang-label active' : 'lang-label'">EN</span>
      <div class="form-check form-switch m-0 p-0">
        <input class="form-check-input lang-toggle" type="checkbox" role="switch" id="langToggle"
               aria-label="Switch app language between English and Croatian"
               th:checked="${#locale.language == 'hr'}">
      </div>
      <span th:class="${#locale.language == 'hr'} ? 'lang-label active' : 'lang-label'">HR</span>
    </div>

    <div class="role-switch" role="group" aria-label="Preview as role"
         sec:authorize="hasAnyRole('SWITCH_USER','PREVIOUS_ADMINISTRATOR')"
         th:attr="data-previewing=${#authorization.expression('hasRole(''PREVIOUS_ADMINISTRATOR'')')}">
      <span class="role-switch-label"><i class="bi bi-eye me-1"></i>View as</span>
      <button type="button" data-role-switch="ADMIN" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'active' : ''">Admin</button>
      <button type="button" data-role-switch="test-official" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''OFFICIAL'')')} ? 'active' : ''">Official</button>
      <button type="button" data-role-switch="test-viewer" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''VIEWER'')')} ? 'active' : ''">Viewer</button>
    </div>

    <span class="role-pill" sec:authorize="!hasAnyRole('SWITCH_USER','PREVIOUS_ADMINISTRATOR')"
          th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasRole(''OFFICIAL'')') ? 'OFFICIAL' : 'VIEWER')}">ROLE</span>

    <span class="app-user-name d-none d-md-inline">
      <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span>
    </span>

    <form th:action="@{/logout}" method="post" class="m-0">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
        <i class="bi bi-box-arrow-right"></i><span class="d-none d-sm-inline">Sign out</span>
      </button>
    </form>
  </div>
</header>
<!-- ===== END TOPBAR ===== -->

<!-- ===== MAIN ===== -->
<main class="app-content">
  <div class="container-fluid px-4">

    <!-- Flash alert (auto-dismisses) -->
    <div th:if="${flashMsg}"
         class="alert alert-success alert-dismissible auto-dismiss fade show mb-3"
         role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${flashMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <!-- Error alert (stays until dismissed) -->
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show mb-3"
         role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <th:block layout:fragment="content">
      <!-- page body inserted here -->
    </th:block>
  </div>
</main>
<!-- ===== END MAIN ===== -->

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
