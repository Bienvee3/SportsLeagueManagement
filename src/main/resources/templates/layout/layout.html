<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <title layout:title-pattern="$CONTENT_TITLE — League Ops">League Ops</title>
  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom design system -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:attr="data-msg-generating=#{common.js.generating},data-msg-chronicle-error=#{common.js.chronicleError}">

<!-- ===== TOPBAR ===== -->
<header class="app-nav">

  <!-- Brand -->
  <a th:href="@{/}" class="app-brand">
    <i class="bi bi-dribbble brand-icon"></i>LeagueOps
  </a>

  <!-- Primary navigation -->
  <nav class="app-nav-center" aria-label="Main navigation">
    <a th:href="@{/}" class="app-nav-link"
       th:classappend="${currentPage == 'dashboard'} ? ' active'">
      <i class="bi bi-speedometer2"></i><span class="label" th:text="#{common.nav.dashboard}">Dashboard</span>
    </a>
    <a th:href="@{/leagues}" class="app-nav-link"
       th:classappend="${currentPage == 'leagues'} ? ' active'">
      <i class="bi bi-trophy"></i><span class="label" th:text="#{common.nav.leagues}">Leagues</span>
    </a>
    <a th:href="@{/teams}" class="app-nav-link"
       th:classappend="${currentPage == 'teams'} ? ' active'">
      <i class="bi bi-people"></i><span class="label" th:text="#{common.nav.teams}">Teams</span>
    </a>
  </nav>

  <!-- Role switcher (dev preview) + user menu -->
  <div class="app-nav-right">
    <div class="lang-switch" role="group" th:attr="aria-label=#{common.lang.title},title=#{common.lang.title}">
      <button type="button" data-app-lang="en" class="lang-btn"
              th:classappend="${#locale.language != 'hr'} ? 'active' : ''">EN</button>
      <button type="button" data-app-lang="hr" class="lang-btn"
              th:classappend="${#locale.language == 'hr'} ? 'active' : ''">HR</button>
    </div>

    <div class="role-switch" role="group" aria-label="Preview as role"
         sec:authorize="hasAnyRole('SWITCH_USER','PREVIOUS_ADMINISTRATOR')"
         th:attr="data-previewing=${#authorization.expression('hasRole(''PREVIOUS_ADMINISTRATOR'')')}">
      <span class="role-switch-label"><i class="bi bi-eye me-1"></i><span th:text="#{common.viewas}">View as</span></span>
      <button type="button" data-role-switch="ADMIN" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'active' : ''" th:text="#{common.role.admin}">Admin</button>
      <button type="button" data-role-switch="test-official" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''OFFICIAL'')')} ? 'active' : ''" th:text="#{common.role.official}">Official</button>
      <button type="button" data-role-switch="test-viewer" class="role-switch-btn"
              th:classappend="${#authorization.expression('hasRole(''VIEWER'')')} ? 'active' : ''" th:text="#{common.role.viewer}">Viewer</button>
    </div>

    <span class="role-pill" sec:authorize="!hasAnyRole('SWITCH_USER','PREVIOUS_ADMINISTRATOR')"
          th:text="${#authorization.expression('hasRole(''ADMIN'')')} ? #{common.role.admin} : (${#authorization.expression('hasRole(''OFFICIAL'')')} ? #{common.role.official} : #{common.role.viewer})">ROLE</span>

    <span class="app-user-name d-none d-md-inline">
      <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span>
    </span>

    <form th:action="@{/logout}" method="post" class="m-0">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
        <i class="bi bi-box-arrow-right"></i><span class="d-none d-sm-inline" th:text="#{common.signout}">Sign out</span>
      </button>
    </form>
  </div>
</header>
<!-- ===== END TOPBAR ===== -->

<!-- ===== MAIN ===== -->
<main class="app-content">
  <div class="container-fluid px-4">

    <!-- Flash alert (auto-dismisses): translated key, or raw text -->
    <div th:if="${flashKey != null or flashMsg != null}"
         class="alert alert-success alert-dismissible auto-dismiss fade show mb-3"
         role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${flashKey != null} ? #{${flashKey}} : ${flashMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{common.close}"></button>
    </div>
    <!-- Error alert (stays until dismissed) -->
    <div th:if="${errorKey != null or errorMsg != null}"
         class="alert alert-danger alert-dismissible fade show mb-3"
         role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorKey != null} ? #{${errorKey}} : ${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{common.close}"></button>
    </div>

    <th:block layout:fragment="content">
      <!-- page body inserted here -->
    </th:block>
  </div>
</main>
<!-- ===== END MAIN ===== -->

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
