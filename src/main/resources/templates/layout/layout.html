<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE — League Ops">League Ops</title>
  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom design system -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ===== TOPBAR ===== -->
<header class="app-nav">

  <!-- Brand -->
  <a th:href="@{/}" class="app-brand">
    <i class="bi bi-dribbble brand-icon"></i>LeagueOps
  </a>

  <!-- Primary navigation -->
  <nav class="app-nav-center" aria-label="Main navigation">
    <a th:href="@{/}" class="app-nav-link"
       th:classappend="${currentPage == 'dashboard'} ? ' active'">
      <i class="bi bi-speedometer2"></i><span class="label">Dashboard</span>
    </a>
    <a th:href="@{/leagues}" class="app-nav-link"
       th:classappend="${currentPage == 'leagues'} ? ' active'">
      <i class="bi bi-trophy"></i><span class="label">Leagues</span>
    </a>
    <a th:href="@{/teams}" class="app-nav-link"
       th:classappend="${currentPage == 'teams'} ? ' active'">
      <i class="bi bi-people"></i><span class="label">Teams</span>
    </a>
  </nav>

  <!-- Role pill + user menu -->
  <div class="app-nav-right">
    <span class="role-pill" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasRole(''OFFICIAL'')') ? 'OFFICIAL' : 'VIEWER')}">ROLE</span>

    <div class="dropdown">
      <button class="btn btn-sm app-user-btn dropdown-toggle d-flex align-items-center gap-2"
              type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-md-inline" sec:authentication="name">user</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <span class="dropdown-item-text">
            <span class="fw-semibold d-block" sec:authentication="name">user</span>
            <span class="text-muted small" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasRole(''OFFICIAL'')') ? 'OFFICIAL' : 'VIEWER')}">ROLE</span>
          </span>
        </li>
        <li><hr class="dropdown-divider"></li>

        <!-- Role switcher: visible only when user has ROLE_SWITCH_USER (admin) -->
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <span class="dropdown-item-text small text-muted text-uppercase fw-semibold"
                style="font-size:.65rem;letter-spacing:.06em">Switch Role (dev)</span>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="username" value="test-official">
            <button type="submit" class="dropdown-item rounded">
              <i class="bi bi-shield-half me-2 text-warning"></i>Preview as Official
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="username" value="test-viewer">
            <button type="submit" class="dropdown-item rounded">
              <i class="bi bi-eye me-2 text-info"></i>Preview as Viewer
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('SWITCH_USER') and !hasRole('PREVIOUS_ADMINISTRATOR')">
          <hr class="dropdown-divider">
        </li>

        <!-- Exit impersonation: visible only when switched -->
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <span class="dropdown-item-text text-warning small">
            <i class="bi bi-exclamation-triangle me-1"></i>Role preview active
          </span>
        </li>
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <form th:action="@{/dev/switch-exit}" method="post" class="px-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item rounded text-warning">
              <i class="bi bi-arrow-return-left me-2"></i>Return to Admin
            </button>
          </form>
        </li>
        <li sec:authorize="hasRole('PREVIOUS_ADMINISTRATOR')">
          <hr class="dropdown-divider">
        </li>

        <li>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item text-danger rounded">
              <i class="bi bi-box-arrow-left me-2"></i>Sign out
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
<!-- ===== END TOPBAR ===== -->

<!-- ===== MAIN ===== -->
<main class="app-content">
  <div class="container-fluid px-4">

    <!-- Flash alert (auto-dismisses) -->
    <div th:if="${flashMsg}"
         class="alert alert-success alert-dismissible auto-dismiss fade show mb-3"
         role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${flashMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <!-- Error alert (stays until dismissed) -->
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show mb-3"
         role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <th:block layout:fragment="content">
      <!-- page body inserted here -->
    </th:block>
  </div>
</main>
<!-- ===== END MAIN ===== -->

<!-- Toast container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmzV7Kb+5P4+CtCFjJUBzSrCbxo"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
