<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>New Season</title></head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item"><a th:href="@{/leagues}">Leagues</a></li>
  <li class="breadcrumb-item">
    <a th:href="@{/leagues/{id}(id=${league.id})}" th:text="${league.name}">League</a>
  </li>
  <li class="breadcrumb-item active">New Season</li>
</th:block>
<th:block layout:fragment="content">

  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">

      <div class="page-header">
        <div class="d-flex align-items-center gap-3">
          <a th:href="@{/leagues/{id}(id=${league.id})}"
             class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
          </a>
          <div>
            <h1 class="h3 fw-bold mb-0">New Season</h1>
            <div class="text-secondary small" th:text="${league.name}">League</div>
          </div>
        </div>
      </div>

      <div class="sport-card p-4">
        <form th:action="@{/leagues/{id}/seasons(id=${league.id})}"
              th:object="${form}" method="post" novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <!-- Season name -->
          <div class="mb-3">
            <label for="name" class="form-label fw-medium">Season name <span class="text-danger">*</span></label>
            <input type="text" id="name"
                   class="form-control" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                   th:field="*{name}" required maxlength="100"
                   placeholder="e.g. 2026/2027 Season">
            <div class="invalid-feedback" th:errors="*{name}">Required</div>
          </div>

          <div class="row g-3 mb-4">
            <!-- Year start -->
            <div class="col-6">
              <label for="yearStart" class="form-label fw-medium">Start year <span class="text-danger">*</span></label>
              <input type="number" id="yearStart"
                     class="form-control font-monospace"
                     th:classappend="${#fields.hasErrors('yearStart')} ? ' is-invalid'"
                     th:field="*{yearStart}" required min="1900" max="2100"
                     placeholder="2026">
              <div class="invalid-feedback" th:errors="*{yearStart}">Required</div>
            </div>
            <!-- Year end -->
            <div class="col-6">
              <label for="yearEnd" class="form-label fw-medium">End year <span class="text-danger">*</span></label>
              <input type="number" id="yearEnd"
                     class="form-control font-monospace"
                     th:classappend="${#fields.hasErrors('yearEnd')} ? ' is-invalid'"
                     th:field="*{yearEnd}" required min="1900" max="2100"
                     placeholder="2027">
              <div class="invalid-feedback" th:errors="*{yearEnd}">Must be &gt; start year</div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Create Season
            </button>
            <a th:href="@{/leagues/{id}(id=${league.id})}"
               class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>

    </div>
  </div>

</th:block>
</body>
</html>
