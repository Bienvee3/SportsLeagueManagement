<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="#{seasons.calendar.titleWithSeason(${season.name})}">Calendar</title></head>
<body>
<th:block layout:fragment="content">

  <div class="page-header">
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${season.id})}"
         class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div>
        <h1 class="h3 fw-bold mb-1" th:text="#{seasons.calendar.title}">Calendar</h1>
        <div class="text-secondary small" th:text="${league.name} + ' · ' + ${season.name}">League · Season</div>
      </div>
    </div>

    <!-- ADMIN: create the next round -->
    <form sec:authorize="hasRole('ADMIN')" th:if="${season.status != 'COMPLETED'}"
          th:action="@{/leagues/{lid}/seasons/{sid}/rounds(lid=${league.id},sid=${season.id})}"
          method="post" class="d-flex flex-wrap gap-2 align-items-end">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div>
        <label class="form-label small text-secondary mb-1" for="roundStart" th:text="#{seasons.calendar.startDate}">Start date (optional)</label>
        <input id="roundStart" name="startDate" type="date" class="form-control form-control-sm">
      </div>
      <button type="submit" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i><span th:text="#{seasons.calendar.newRound(${#lists.size(rounds) + 1})}">New round 2</span>
      </button>
    </form>
  </div>

  <!-- Empty -->
  <div th:if="${#lists.isEmpty(rounds)}" class="sport-card">
    <div class="text-center py-5">
      <i class="bi bi-calendar-x display-4 text-secondary mb-3 d-block"></i>
      <p class="text-secondary mb-0" th:text="#{seasons.calendar.noRounds}">No rounds yet.</p>
      <p class="text-secondary small mb-0" sec:authorize="hasRole('ADMIN')" th:text="#{seasons.calendar.noRoundsHint}">
        Generate a schedule from the season page, or create rounds here one by one.
      </p>
    </div>
  </div>

  <!-- Rounds -->
  <th:block th:each="r : ${rounds}">
    <div class="d-flex align-items-center gap-2 mt-4 mb-2" th:id="'round-' + ${r.id}" style="scroll-margin-top:90px">
      <span class="badge px-3 py-2" style="background:#f97316" th:text="#{seasons.calendar.round(${r.roundNumber})}">Round 1</span>
      <span class="fw-semibold" th:unless="${r.name == 'Round ' + r.roundNumber}" th:text="${r.name}">Name</span>
      <span class="text-secondary small font-monospace" th:if="${r.startDate != null}" th:text="${r.startDate}">Date</span>
      <span class="badge bg-secondary ms-auto" th:text="#{seasons.calendar.matchCount(${r.fixtureCount})}">0 matches</span>
      <form sec:authorize="hasRole('ADMIN')"
            th:action="@{/leagues/{lid}/seasons/{sid}/rounds/{rid}/delete(lid=${league.id},sid=${season.id},rid=${r.id})}"
            method="post" class="m-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{seasons.calendar.deleteRound}" title="Delete round"
                th:attr="data-confirm=#{seasons.calendar.confirmDeleteRound}" data-confirm="Delete this round and all its unplayed matches?">
          <i class="bi bi-trash"></i>
        </button>
      </form>
    </div>

    <div th:if="${fixturesByRound[r.id] == null}" class="sport-card mb-2">
      <div class="py-3 px-3 text-secondary small" th:text="#{seasons.calendar.noMatches}">No matches in this round yet.</div>
    </div>

    <div th:each="f : ${fixturesByRound[r.id]}" class="sport-card mb-2">
      <div class="py-2 px-3 d-flex align-items-center gap-3 flex-wrap">
        <a th:href="@{/fixtures/{id}(id=${f.id})}"
           class="d-flex align-items-center gap-3 flex-grow-1 text-decoration-none text-reset"
           style="min-width:260px">
          <div class="text-end flex-grow-1 fw-semibold text-truncate" style="flex-basis:0" th:text="${f.homeTeamName}">Home</div>
          <div class="text-center flex-shrink-0" style="min-width:90px">
            <th:block th:if="${f.homeScore != null}">
              <span class="fw-bold font-monospace fs-5">
                <span th:text="${f.homeScore}">0</span>
                <span class="text-secondary">–</span>
                <span th:text="${f.awayScore}">0</span>
              </span>
            </th:block>
            <th:block th:if="${f.homeScore == null}">
              <span class="text-secondary small fw-semibold" th:text="#{seasons.calendar.vs}">vs</span>
            </th:block>
          </div>
          <div class="flex-grow-1 fw-semibold text-truncate" style="flex-basis:0" th:text="${f.awayTeamName}">Away</div>
        </a>
        <div class="text-secondary small font-monospace flex-shrink-0">
          <i class="bi bi-clock me-1"></i><span th:text="${f.scheduledTime.toString().substring(0,16).replace('T',' ')}">2026-01-01 15:00</span>
        </div>
        <span class="badge flex-shrink-0" th:classappend="'badge-' + ${f.status}"
              th:text="#{'status.' + ${f.status}}">SCHEDULED</span>
        <div class="flex-shrink-0 d-flex gap-1">
          <a sec:authorize="hasAnyRole('ADMIN','OFFICIAL')"
             th:if="${f.status == 'SCHEDULED' or f.status == 'IN_PROGRESS'}"
             th:href="@{/fixtures/{id}(id=${f.id})}"
             class="btn btn-sm btn-outline-warning">
            <i class="bi bi-pencil-square me-1"></i><span th:text="#{seasons.calendar.recordResult}">Record result</span>
          </a>
          <a th:href="@{/fixtures/{id}(id=${f.id})}" class="btn btn-sm btn-outline-secondary" th:title="#{seasons.calendar.details}" title="Details">
            <i class="bi bi-chevron-right"></i>
          </a>
          <form sec:authorize="hasRole('ADMIN')" th:if="${f.status != 'FINISHED'}"
                th:action="@{/leagues/{lid}/seasons/{sid}/rounds/{rid}/fixtures/{fid}/delete(lid=${league.id},sid=${season.id},rid=${r.id},fid=${f.id})}"
                method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{seasons.calendar.deleteMatch}" title="Delete match"
                    th:attr="data-confirm=#{seasons.calendar.confirmDeleteMatch}" data-confirm="Delete this match?">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ADMIN: add a match to this round -->
    <form sec:authorize="hasRole('ADMIN')" th:if="${season.status != 'COMPLETED'}"
          th:action="@{/leagues/{lid}/seasons/{sid}/rounds/{rid}/fixtures(lid=${league.id},sid=${season.id},rid=${r.id})}"
          method="post" class="sport-card p-3 mb-2 d-flex flex-wrap gap-2 align-items-end">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="flex-grow-1" style="min-width:180px">
        <label class="form-label small text-secondary mb-1" th:text="#{seasons.calendar.home}">Home</label>
        <select name="homeTeamId" class="form-select form-select-sm" required>
          <option value="" th:text="#{seasons.calendar.selectTeam}">Select team…</option>
          <option th:each="t : ${registeredTeams}" th:value="${t.id}" th:text="${t.name}">Team</option>
        </select>
      </div>
      <div class="flex-grow-1" style="min-width:180px">
        <label class="form-label small text-secondary mb-1" th:text="#{seasons.calendar.away}">Away</label>
        <select name="awayTeamId" class="form-select form-select-sm" required>
          <option value="" th:text="#{seasons.calendar.selectTeam}">Select team…</option>
          <option th:each="t : ${registeredTeams}" th:value="${t.id}" th:text="${t.name}">Team</option>
        </select>
      </div>
      <div>
        <label class="form-label small text-secondary mb-1" th:text="#{seasons.calendar.kickoff}">Kick-off (UTC)</label>
        <input name="scheduledTime" type="datetime-local" class="form-control form-control-sm" required>
      </div>
      <button type="submit" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i><span th:text="#{seasons.calendar.addMatch}">Add match</span>
      </button>
    </form>
  </th:block>

</th:block>
</body>
</html>
