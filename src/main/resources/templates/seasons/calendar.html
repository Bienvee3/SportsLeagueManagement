<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title th:text="${season.name} + ' — Calendar'">Calendar</title></head>
<body>
<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item"><a th:href="@{/leagues}">Leagues</a></li>
  <li class="breadcrumb-item">
    <a th:href="@{/leagues/{id}(id=${league.id})}" th:text="${league.name}">League</a>
  </li>
  <li class="breadcrumb-item">
    <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${season.id})}"
       th:text="${season.name}">Season</a>
  </li>
  <li class="breadcrumb-item active">Calendar</li>
</th:block>
<th:block layout:fragment="content">

  <div class="d-flex align-items-center gap-3 mb-4">
    <a th:href="@{/leagues/{lid}/seasons/{sid}(lid=${league.id},sid=${season.id})}"
       class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div>
      <h1 class="h3 fw-bold mb-1">Calendar</h1>
      <div class="text-muted small" th:text="${league.name} + ' · ' + ${season.name}">League · Season</div>
    </div>
  </div>

  <!-- Empty -->
  <div th:if="${#lists.isEmpty(fixtures)}" class="card shadow-sm">
    <div class="card-body text-center py-5">
      <i class="bi bi-calendar-x display-5 text-muted mb-3 d-block"></i>
      <p class="text-muted mb-0">No fixtures scheduled yet.</p>
    </div>
  </div>

  <!-- Fixtures grouped by round -->
  <th:block th:if="${not #lists.isEmpty(fixtures)}">
    <th:block th:with="prevRound=-1">
      <th:block th:each="f : ${fixtures}">

        <!-- Round header (show when round changes) -->
        <div th:if="${f.roundNumber != prevRound}"
             class="d-flex align-items-center gap-2 mt-4 mb-2">
          <span class="badge bg-primary" th:text="'Round ' + ${f.roundNumber}">Round 1</span>
          <span class="text-muted small font-mono"
                th:text="${#temporals.format(f.scheduledTime, 'EEE dd MMM yyyy')}">Date</span>
          <th:block th:with="prevRound=${f.roundNumber}"></th:block>
        </div>

        <div class="card shadow-sm mb-2">
          <a th:href="@{/fixtures/{id}(id=${f.id})}"
             class="card-body py-2 px-3 text-decoration-none text-dark d-flex align-items-center gap-3">
            <!-- Home team -->
            <div class="text-end flex-grow-1 fw-medium text-truncate" th:text="${f.homeTeamName}">Home</div>
            <!-- Score / Status -->
            <div class="text-center flex-shrink-0" style="min-width:80px">
              <th:block th:if="${f.homeScore != null}">
                <span class="score-box">
                  <span th:text="${f.homeScore}">0</span>
                  <span class="text-muted">–</span>
                  <span th:text="${f.awayScore}">0</span>
                </span>
              </th:block>
              <th:block th:if="${f.homeScore == null}">
                <span class="badge" th:classappend="'badge-' + ${f.status}"
                      th:text="${f.status}">SCH</span>
              </th:block>
            </div>
            <!-- Away team -->
            <div class="flex-grow-1 fw-medium text-truncate" th:text="${f.awayTeamName}">Away</div>
            <i class="bi bi-chevron-right text-muted flex-shrink-0"></i>
          </a>
        </div>

      </th:block>
    </th:block>
  </th:block>

</th:block>
</body>
</html>
