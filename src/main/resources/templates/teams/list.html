<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="#{teams.list.title}">Teams</title></head>
<body>
<th:block layout:fragment="content">

  <div class="page-header">
    <div>
      <h1 class="h3 fw-bold mb-1" th:text="#{teams.list.title}">Teams</h1>
      <p class="text-secondary mb-0 small" th:text="#{teams.list.subtitle}">All registered clubs</p>
    </div>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/teams/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{teams.list.new}">New Team</span>
    </a>
  </div>

  <!-- Sport filter -->
  <div class="d-flex flex-wrap gap-2 mb-3" th:if="${not #lists.isEmpty(sports)}">
    <a th:href="@{/teams}" class="btn btn-sm"
       th:classappend="${selectedSport == null} ? 'btn-primary' : 'btn-outline-secondary'" th:text="#{teams.filter.all}">All sports</a>
    <a th:each="s : ${sports}" th:href="@{/teams(sport=${s})}" class="btn btn-sm text-capitalize"
       th:classappend="${s == selectedSport} ? 'btn-primary' : 'btn-outline-secondary'"
       th:text="#{'sport.' + ${s}}">Football</a>
  </div>

  <div class="sport-card">
    <div th:if="${#lists.isEmpty(teams)}" class="text-center py-5">
      <i class="bi bi-people display-5 text-secondary mb-3 d-block"></i>
      <p class="text-secondary mb-0" th:text="#{teams.list.empty}">No teams registered yet.</p>
    </div>

    <div th:if="${not #lists.isEmpty(teams)}" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th th:text="#{teams.col.code}">Code</th>
            <th th:text="#{teams.col.name}">Name</th>
            <th th:text="#{teams.col.sport}">Sport</th>
            <th th:text="#{teams.col.stadium}">Stadium</th>
            <th th:text="#{teams.col.city}">City</th>
            <th th:text="#{teams.col.founded}">Founded</th>
            <th class="table-actions"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="t : ${teams}">
            <td>
              <span class="badge font-monospace"
                    style="background:rgba(249,115,22,.15);color:#f97316;border:1px solid rgba(249,115,22,.4);letter-spacing:.06em"
                    th:text="${t.shortCode}">DZG</span>
            </td>
            <td>
              <a th:href="@{/teams/{id}(id=${t.id})}"
                 class="fw-semibold text-decoration-none" th:text="${t.name}">Name</a>
            </td>
            <td>
              <span class="badge bg-secondary text-uppercase" th:text="#{'sport.' + ${t.sportType}}">FOOTBALL</span>
            </td>
            <td class="text-secondary" th:text="${t.stadiumName}">—</td>
            <td class="text-secondary" th:text="${t.city}">—</td>
            <td class="font-monospace text-secondary small" th:text="${t.foundedYear}">—</td>
            <td>
              <div class="d-flex gap-1 justify-content-end">
                <a th:href="@{/teams/{id}(id=${t.id})}"
                   class="btn btn-sm btn-outline-secondary" th:title="#{teams.action.view}" title="View">
                  <i class="bi bi-eye"></i>
                </a>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{/teams/{id}/edit(id=${t.id})}"
                   class="btn btn-sm btn-outline-primary" th:title="#{teams.action.edit}" title="Edit">
                  <i class="bi bi-pencil"></i>
                </a>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{/teams/{id}/delete(id=${t.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button type="submit" class="btn btn-sm btn-outline-danger"
                          th:attr="data-confirm=#{teams.confirm.delete}" data-confirm="Delete this team? This cannot be undone.">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</th:block>
</body>
</html>
