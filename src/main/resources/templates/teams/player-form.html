<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title th:text="#{teams.squad.editTitle}">Edit player</title>
</head>
<body>
<th:block layout:fragment="content">

  <div class="mx-auto" style="max-width:600px">

    <div class="page-header">
      <div class="d-flex align-items-center gap-3">
        <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h1 class="h3 fw-bold mb-0" th:text="#{teams.squad.editTitle}">Edit player</h1>
          <div class="text-secondary small" th:text="${team.name}">Team</div>
        </div>
      </div>
    </div>

    <div class="sport-card p-4">
      <form th:action="@{/teams/{id}/players/{pid}(id=${team.id},pid=${player.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-8">
            <label for="name" class="form-label fw-medium"><span th:text="#{teams.squad.col.name}">Player</span> <span class="text-danger">*</span></label>
            <input type="text" id="name" name="name" class="form-control"
                   th:value="${player.name}" required maxlength="100"
                   th:placeholder="#{teams.squad.name.placeholder}" placeholder="Player name">
          </div>
          <div class="col-12 col-md-4">
            <label for="shirtNumber" class="form-label fw-medium"><span th:text="#{teams.squad.col.number}">No.</span> <span class="text-danger">*</span></label>
            <input type="number" id="shirtNumber" name="shirtNumber" class="form-control font-monospace"
                   th:value="${player.shirtNumber}" min="1" max="99" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="position" class="form-label fw-medium" th:text="#{teams.squad.col.position}">Position</label>
          <input type="text" id="position" name="position" class="form-control"
                 th:value="${player.position}" maxlength="30"
                 th:placeholder="#{teams.squad.position.placeholder}" placeholder="e.g. Goalkeeper">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg me-1"></i>
            <span th:text="#{teams.form.save}">Save changes</span>
          </button>
          <a th:href="@{/teams/{id}(id=${team.id})}"
             class="btn btn-outline-secondary" th:text="#{teams.form.cancel}">Cancel</a>
        </div>
      </form>
    </div>

  </div>

</th:block>
</body>
</html>
