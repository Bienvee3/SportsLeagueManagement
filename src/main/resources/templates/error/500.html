<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>Server Error</title></head>
<body>
<th:block layout:fragment="content">
  <div class="error-page">
    <div class="mb-2" style="font-size:3rem"><i class="bi bi-exclamation-octagon-fill text-danger"></i></div>
    <div class="error-code error-500">500</div>
    <h2 class="fw-bold mt-3 mb-2">Red card for the server</h2>
    <p class="text-muted mb-1">Something went wrong on our side of the pitch.</p>
    <p class="text-muted mb-4"
       th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'"></p>
    <a th:href="@{/}" class="btn btn-primary">
      <i class="bi bi-house me-2"></i>Back to Dashboard
    </a>
  </div>
</th:block>
</body>
</html>
