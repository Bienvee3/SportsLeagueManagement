<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>Not Found</title></head>
<body>
<th:block layout:fragment="content">
  <div class="error-page">
    <div class="error-ball mb-2">⚽</div>
    <div class="error-code error-404">404</div>
    <h2 class="fw-bold mt-3 mb-2">Ball out of play</h2>
    <p class="text-muted mb-1">The page you were looking for went missing. Looks like it's been sent off.</p>
    <p class="text-muted mb-4"
       th:text="${errorMessage} ?: 'The resource you requested does not exist.'"></p>
    <a th:href="@{/}" class="btn btn-primary">
      <i class="bi bi-house me-2"></i>Back to Dashboard
    </a>
  </div>
</th:block>
</body>
</html>
