<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title>Not Found</title></head>
<body>

<nav class="crumbs" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <span aria-current="page">Not Found</span>
</nav>

<div layout:fragment="content">
  <div class="empty" style="padding-top:64px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>
    <h3>404 — Not Found</h3>
    <p th:text="${errorMessage ?: 'The resource you requested does not exist.'}"></p>
    <a class="btn" th:href="@{/}">Back to Dashboard</a>
  </div>
</div>
</body>
</html>
