<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head><title th:text="#{pages.error.404.title}">Not Found</title></head>
<body>
<th:block layout:fragment="content">
  <div class="error-page">
    <div class="error-ball mb-2">⚽</div>
    <div class="error-code error-404">404</div>
    <h2 class="fw-bold mt-3 mb-2" th:text="#{pages.error.404.heading}">Ball out of play</h2>
    <p class="text-muted mb-1" th:text="#{pages.error.404.text}">The page you were looking for went missing. Looks like it's been sent off.</p>
    <p class="text-muted mb-4"
       th:text="${errorMessage} ?: #{pages.error.404.fallback}"></p>
    <a th:href="@{/}" class="btn btn-primary">
      <i class="bi bi-house me-2"></i><span th:text="#{pages.error.back}">Back to Dashboard</span>
    </a>
  </div>
</th:block>
</body>
</html>
