<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title th:text="#{pages.dashboard.title}">Dashboard</title></head>
<body>

<th:block layout:fragment="content">

  <div class="page-header">
    <div>
      <h1 class="h3 fw-bold mb-1" th:text="#{pages.dashboard.heading}">Dashboard</h1>
      <p class="text-secondary mb-0 small">
        <span th:text="#{pages.dashboard.welcome(${#authentication.name})}">Welcome back, user</span>
      </p>
    </div>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/leagues/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{pages.dashboard.newLeague}">New League</span>
    </a>
  </div>

  <!-- KPI row -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="kpi-card">
        <div class="kpi-icon">🏆</div>
        <div class="kpi-value" th:text="${@fmt.number(#lists.size(leagues))}">0</div>
        <div class="kpi-label" th:text="#{pages.dashboard.kpi.leagues}">Leagues</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="kpi-card">
        <div class="kpi-icon">🗓</div>
        <div class="kpi-value" th:text="${@fmt.number(seasonCount)}">0</div>
        <div class="kpi-label" th:text="#{pages.dashboard.kpi.seasons}">Seasons</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="kpi-card">
        <div class="kpi-icon">👥</div>
        <div class="kpi-value" th:text="${@fmt.number(teamCount)}">0</div>
        <div class="kpi-label" th:text="#{pages.dashboard.kpi.teams}">Teams</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="kpi-card">
        <div class="kpi-icon">🔥</div>
        <div class="kpi-value" th:text="${@fmt.number(activeSeasonCount)}">0</div>
        <div class="kpi-label" th:text="#{pages.dashboard.kpi.activeSeasons}">Active seasons</div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(leagues)}" class="sport-card text-center py-5">
    <i class="bi bi-trophy display-4 text-secondary mb-3 d-block"></i>
    <h5 th:text="#{pages.dashboard.empty.title}">No leagues yet</h5>
    <p class="text-secondary" th:text="#{pages.dashboard.empty.text}">Create your first league to get started.</p>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/leagues/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i><span th:text="#{pages.dashboard.empty.create}">Create League</span>
    </a>
  </div>

  <!-- League cards -->
  <div th:if="${not #lists.isEmpty(leagues)}"
       class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
    <div class="col" th:each="l : ${leagues}">
      <a th:href="@{/leagues/{id}(id=${l.id})}"
         class="sport-card d-block h-100 text-decoration-none">
        <div class="p-3">
          <div class="d-flex align-items-start justify-content-between mb-2">
            <h5 class="mb-0 fw-semibold text-light" th:text="${l.name}">League Name</h5>
            <span class="badge bg-secondary ms-2 text-uppercase" style="font-size:.65rem;"
                  th:text="#{'sport.' + ${l.sportType}}">FOOTBALL</span>
          </div>
          <p class="text-secondary small mb-0">
            <i class="bi bi-geo-alt me-1"></i>
            <span th:text="${l.country}">Country</span>
          </p>
        </div>
        <div class="px-3 py-2 border-top border-secondary-subtle small text-secondary d-flex align-items-center gap-1">
          <i class="bi bi-arrow-right-circle"></i> <span th:text="#{pages.dashboard.viewSeasons}">View seasons &amp; standings</span>
        </div>
      </a>
    </div>
  </div>

</th:block>
</body>
</html>
