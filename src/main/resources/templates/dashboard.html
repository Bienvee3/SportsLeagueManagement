<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title>Dashboard</title></head>
<body>

<th:block layout:fragment="breadcrumb">
  <li class="breadcrumb-item active">Dashboard</li>
</th:block>

<th:block layout:fragment="content">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 fw-bold mb-1">Dashboard</h1>
      <p class="text-muted mb-0 small">All leagues at a glance</p>
    </div>
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/leagues/new}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>New League
    </a>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(leagues)}" class="card text-center py-5">
    <div class="card-body">
      <i class="bi bi-trophy display-5 text-muted mb-3 d-block"></i>
      <h5 class="card-title">No leagues yet</h5>
      <p class="card-text text-muted">Create your first league to get started.</p>
      <a sec:authorize="hasRole('ADMIN')"
         th:href="@{/leagues/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Create League
      </a>
    </div>
  </div>

  <!-- League cards -->
  <div th:if="${not #lists.isEmpty(leagues)}"
       class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
    <div class="col" th:each="l : ${leagues}">
      <a th:href="@{/leagues/{id}(id=${l.id})}"
         class="card h-100 text-decoration-none text-dark shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-start justify-content-between mb-2">
            <h5 class="card-title mb-0 fw-semibold" th:text="${l.name}">League Name</h5>
            <span class="badge bg-secondary ms-2 text-uppercase" style="font-size:.65rem;"
                  th:text="${l.sportType}">FOOTBALL</span>
          </div>
          <p class="text-muted small mb-0">
            <i class="bi bi-geo-alt me-1"></i>
            <span th:text="${l.country}">Country</span>
          </p>
        </div>
        <div class="card-footer bg-transparent small text-muted d-flex align-items-center gap-1">
          <i class="bi bi-arrow-right-circle"></i> View seasons &amp; standings
        </div>
      </a>
    </div>
  </div>

</th:block>
</body>
</html>
