<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head><title>Dashboard</title></head>
<body>

<nav class="crumbs" aria-label="Breadcrumb" layout:fragment="breadcrumb">
  <span aria-current="page">Dashboard</span>
</nav>

<div layout:fragment="content">

  <div class="page-head">
    <div>
      <h1>Dashboard</h1>
      <p class="lede">Overview of all leagues and seasons.</p>
    </div>
  </div>

  <!-- leagues list -->
  <div th:if="${leagues.empty}" class="panel">
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>
      <h3>No leagues yet</h3>
      <p>Create your first league to get started.</p>
      <a class="btn primary" th:href="@{/leagues/new}" sec:authorize="hasRole('ADMIN')">New League</a>
    </div>
  </div>

  <div th:unless="${leagues.empty}" class="panel">
    <div class="panel-head">
      <h2>Leagues</h2>
      <a class="btn sm" th:href="@{/leagues}">View all</a>
    </div>
    <div class="list">
      <a th:each="l : ${leagues}"
         th:href="@{/leagues/{id}(id=${l.id})}"
         style="text-decoration:none;color:inherit;">
        <div class="grow">
          <div th:text="${l.name}" style="font-weight:500;"></div>
          <div class="sub" th:text="${l.country + ' · ' + l.sportType}"></div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </div>
  </div>

</div>
</body>
</html>
