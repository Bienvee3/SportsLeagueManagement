spring:
  application:
    name: sports-league-management
  profiles:
    active: dev
  quartz:
    job-store-type: jdbc
    scheduler-name: sports-league-scheduler
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never   # tables come from Flyway migration V11
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.isClustered: true   # several instances share the job store; one fires each trigger
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.threadPool.threadCount: 2
  ai:
    model:
      chat: google-genai            # SPRING_AI_MODEL_CHAT=none runs the app without the AI provider
    google:
      genai:
        api-key: ${GEMINI_API_KEY}  # no default: with the provider on, startup fails if the key is missing
        chat:
          model: gemini-3.5-flash
          temperature: 0.7
          max-output-tokens: 2048

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha

server:
  port: ${PORT:8080}                  # hosting platforms inject PORT
  forward-headers-strategy: framework # trust X-Forwarded-* from the platform's HTTPS proxy

management:
  endpoints:
    web:
      exposure:
        include: health               # only the health check is exposed
  endpoint:
    health:
      show-details: never             # status only: nothing about the database or the host leaks

app:
  # Scheduled jobs (see QuartzJobsConfig). Cron fields: second minute hour day month weekday.
  jobs:
    round-lifecycle:
      cron: "0 0/5 * * * ?"     # every 5 minutes
    overdue-fixtures:
      cron: "0 0 * * * ?"       # every hour
      grace: PT3H               # report matches still SCHEDULED this long after their kick-off time
  # Limits for the Gemini client, see ChronicleAdapterConfig. Spring AI 2.0.2 has no property for them.
  ai:
    timeout-ms: 30000           # per attempt
    max-attempts: 2             # total attempts including the first

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sports_league_db}
    username: ${SPRING_DATASOURCE_USERNAME:league_admin}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SportsLeagueHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Everything comes from the environment, with no defaults: a missing value stops the startup.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SportsLeagueHikariCP-Prod
      maximum-pool-size: 5          # a free managed database allows few connections; 5 covers the web threads
      minimum-idle: 2               # plus the 2 Quartz workers without exhausting it
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
