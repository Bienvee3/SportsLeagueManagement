services:
  postgres:
    image: postgres:17-alpine
    container_name: sports_league_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sports_league_db
      POSTGRES_USER: league_admin
      POSTGRES_PASSWORD: league_dev_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_admin -d sports_league_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

