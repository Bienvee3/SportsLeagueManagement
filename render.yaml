# Render Blueprint: `New > Blueprint` creates the web service from this file.
# Variables marked `sync: false` are asked for in the Render dashboard and never live in the repository.
services:
  - type: web
    name: sportsleaguemanagement
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true            # a commit to main redeploys
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Free instances have 512 MB: keep the JVM well inside it (the Dockerfile default is 75 % of RAM).
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k
      - key: SPRING_DATASOURCE_URL      # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICIAL_USERNAME
        sync: false
      - key: OFFICIAL_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
